# EBAY PSA — configuração canônica. Percentuais inteiros: 20 = 20%.
# Null significa pendência e bloqueia APROVAR; nunca significa custo zero.
min_discount_percent: 20          # filtro anterior preservado, independente do lucro
min_price_usd: 10.0
suspicious_margin_percent: 60      # ROI bruto elevado exige REVISAR
fixed_price_only: true
graded_only: true                 # obrigatório; --include-raw é rejeitado
max_pages: 3
trusted_min_feedback: 50
trusted_min_feedback_pct: 98.0
required_location_country: US
# CGC fica visível como REVISAR enquanto sua regra estiver indefinida.
graded_allow: ["PSA 8", "PSA 9", "PSA 10", "BGS 9", "BGS 9.5", "BGS 10", "BGS 10 BLACK", "TAG 9.5", "TAG 10", "CGC 9", "CGC 9.5", "CGC 10 GEM", "CGC 10 PRISTINE"]

slab_strategy:
  version: '2026-09-05.1'
  languages: [EN, JP, ZH, KO, PT, DE, FR, IT, ES]
  graders:
    PSA:
      grades:
        '8': {psa_grade: 8, factor: 1}
        '9': {psa_grade: 9, factor: 1}
        '10': {psa_grade: 10, factor: 1}
    BGS:
      max_premium_percent: 5
      combine_9_5_premium: null
      grades:
        '9': {psa_grade: 9, factor: 1}
        '9.5': {psa_grade: 9, factor: 1.05}
        '10': {psa_grade: 10, factor: 1}
    TAG:
      grades:
        '9.5': {psa_grade: 9, factor: 1.05}
        '10': {psa_grade: 10, factor: 1}
    CGC: null
  evidence:
    min_sales: 3                    # regra anterior preservada
    windows_days: [180, 365]        # 365d sinaliza dificuldade de revenda
    median_sample_limit: 10         # regra anterior preservada
    max_dispersion_percent: null    # precisa de definição; dispersão é reportada
  costs:
    per_slab_usd: 10
    covers: [shipping, taxes]       # reserva agregada; frete observado não é somado
    coverage_confirmed: false      # confirmar quais trechos/taxas cabem na reserva
    comc_processing_usd: null
    comc_storage_usd: null
    selling_fee_percent: null
    cashout_fee_percent: null
    fee_basis: null                 # suportado: sale_then_cashout
  economics:
    min_profit_usd: null
    min_net_margin_percent: null
    min_net_roi_percent: null
  logistics:
    prefer_vault: true
    resale_route: COMC
    direct_vault_listing: false
