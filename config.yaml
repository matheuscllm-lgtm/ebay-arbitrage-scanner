# EBAY PSA — configuração canônica. Percentuais inteiros: 20 = 20%.
# Null não significa zero; armazenamento null usa a projeção parametrizada abaixo.
min_discount_percent: 30          # espelho CLI; regra efetiva em economics abaixo
min_price_usd: 10.0
suspicious_margin_percent: 60      # legado; não atua no modo profit_or_discount
fixed_price_only: true
graded_only: true                 # obrigatório; --include-raw é rejeitado
max_pages: 3
max_ebay_calls: 500               # teto por execução, incluindo detalhes e retentativas; parada parcial
max_item_details_per_card: 10      # consultas pontuais de idioma, incluídas na contagem da API
trusted_min_feedback: 50
trusted_min_feedback_pct: 98.0
required_location_country: US
# Limites sobre o preço do item; custos e lucro são avaliados separadamente.
graded_allow: ["PSA 8", "PSA 9", "PSA 10", "BGS 9", "BGS 9.5", "BGS 10", "BGS 10 BLACK", "TAG 9.5", "TAG 10", "CGC 9", "CGC 9.5", "CGC 10 GEM", "CGC 10 PRISTINE"]

slab_strategy:
  version: '2026-09-05.4'
  languages: [EN, JP, ZH-HANS, ZH-HANT, KO, PT, DE, FR, IT, ES]
  graders:
    PSA:
      grades:
        '8': {psa_grade: 8, factor: 1}
        '9': {psa_grade: 9, factor: 1}
        '10': {psa_grade: 10, factor: 1}
    BGS:
      max_premium_percent: 5
      combine_9_5_premium: false   # decisão conservadora sob autonomia delegada: teto PSA 9 ×1,05
      grades:
        '9': {psa_grade: 9, factor: 1}
        '9.5': {psa_grade: 9, factor: 1.05}
        '10': {psa_grade: 10, factor: 1}
    TAG:
      max_reference_percent: 100
      grades:
        '9.5': {psa_grade: 9, factor: 1.05}
        '10': {psa_grade: 10, factor: 1}
    CGC:
      max_reference_percent: 40    # confirmado pelo operador em 2026-09-05
      grades:
        '9': {psa_grade: 9, factor: 1}
        '9.5': {psa_grade: 9, factor: 1.05}
        '10': {psa_grade: 10, factor: 1}
  evidence:
    min_sales: 3                    # regra anterior preservada
    windows_days: [180, 365]        # 365d sinaliza dificuldade de revenda
    median_sample_limit: 10         # regra anterior preservada
    max_dispersion_percent: 30      # decisão delegada: acima disso exige REVISAR
  costs:
    per_slab_usd: 10
    covers: [shipping, taxes]       # reserva agregada; frete observado não é somado
    coverage_confirmed: true       # operador: envio/impostos até COMC, inclusive saída do vault
    comc_service: Elite
    comc_processing_usd: 2.50
    comc_storage_usd: null         # null: calcular pela projeção abaixo; sem prazo fica REVISAR
    storage_horizon_days: 120      # operador: 90–120 dias; usar extremo superior na estimativa
    storage_free_days: 90
    storage_monthly_usd: 0.01
    buyer_shipping_markup_usd: 2   # somente base da segurança; não somar ao envio de US$10
    security_daily_fraction: 0.00001
    security_threshold_usd: 50
    selling_fee_percent: 5         # COMC preço fixo; fonte em docs/COMC_COSTS.md
    cashout_fee_percent: 10        # taxa informada pelo operador nesta revisão
    fee_basis: sale_then_cashout    # venda primeiro, saque sobre o saldo restante
  economics:
    # REGRA CANÔNICA DA FROTA (operador, 2026-09-09): o gate usa SÓ MARGEM BRUTA,
    # sem taxa nenhuma. Custos de intermediação continuam sendo CALCULADOS e vão
    # para o JSON/relatório como informação, mas NÃO entram no veredito.
    gate_mode: gross_margin
    # Margem tão alta que é assinatura de referência errada ou carta trocada. REVISA,
    # nunca rejeita. Vale só no modo `gross_margin`: o `suspicious_margin_percent: 60`
    # do topo foi calibrado para o gate antigo (desconto de 20-30% = 25-43% de margem
    # bruta), e sob um gate que aprova a partir de 43% ele fica logo acima do limiar e
    # engoliria negócio normal. 150% = comprar a 40% da referência.
    suspicious_gross_margin_percent: 150
    min_gross_margin_percent: 43    # (referência - preço) / preço x 100, estritamente acima.
                                    # Convenção do repo: percentual INTEIRO. 43 preserva a
                                    # fronteira do antigo desconto de 30% sobre a referência
                                    # (30/(100-30) = 42,857...), com 0,14 p.p. a mais de rigor.
    # --- chaves dos modos legados; sem efeito com gate_mode: gross_margin ---
    min_profit_usd: 40             # estritamente acima, após todos os custos
    min_discount_percent: 30       # estritamente acima, contra PSA ajustado
    require_positive_profit: true # desconto não aprova prejuízo
  logistics:
    prefer_vault: true
    resale_route: COMC
    direct_vault_listing: false

# Coluna informativa "Longo prazo" (docs/LONGO_PRAZO.md, src/longterm.py): perfil da
# carta / fragilidade do dado, só leitura na tabela — não é gate, veredito, ranking nem
# recomendação. Limites das classes LP1-LP4 e coberturas mínimas; inteiros (0-100).
# Pontos por componente/flag e bandas ficam no código (calibração inicial, não validada).
longterm:
  enabled: true
  lp1_min_profile: 70              # LP1: PERFIL >= 70 e FRAGILIDADE <= 30 (e insumos-chave presentes)
  lp1_max_fragility: 30
  lp2_min_profile: 50              # LP2: PERFIL >= 50 e FRAGILIDADE <= 50
  lp2_max_fragility: 50
  lp4_max_profile: 30              # LP4: PERFIL < 30 ou FRAGILIDADE > 70
  lp4_min_fragility: 70
  min_profile_sources: 3           # menos que isto de 5 componentes -> PERFIL n/d
  min_fragility_sources: 3         # menos que isto de 10 fontes -> FRAGILIDADE n/d
  concentration_min_listings: 4    # mesma carta+nota com >= N anúncios no run -> LP:concentracao
  lp1_min_profile_coverage: 4      # de 5 componentes; era fixo no código (PR-C), virou chave
  lp1_min_fragility_coverage: 8    # de 11 flags. CONTAGEM ABSOLUTA preservada: subir
                                   # para 9 rebaixaria linhas que davam LP1 sem
                                   # nenhuma evidência nova, só porque entrou a 11ª
                                   # flag, que é a MENOS disponível de todas.
  # Meses de estoque = anúncios ativos da mesma nota no run / vendas PSA 10 por mês.
  # 11ª flag de FRAGILIDADE (`estoque-alto`): oferta parada em cima de demanda fina.
  supply_months_high: 24           # >= N meses de estoque -> 20 pontos de fragilidade
  supply_months_mid: 12            # >= N meses -> 10 pontos; abaixo disso -> 0
  supply_min_sales_pm: 0.05        # vendas/mês abaixo disto: divisão instável -> n/d

# Cesta de vendas do caminho LEGADO (`pc_sales.comparable_sales`). O caminho VIGENTE
# (`slab_strategy.reference_sales`) já exige o número da carta no título da venda.
# Ligar aqui unifica as duas réguas, ao custo de uma cesta MENOR — e a cobertura de
# referência já é o gargalo do scanner (2,7% das linhas do run de 2026-09-09).
# Por isso o padrão fica FALSE: a chave existe e é reversível, mas não foi virada.
legacy_reference:
  require_number_in_sale_title: false
