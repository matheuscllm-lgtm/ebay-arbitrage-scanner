# Example target list. Copy to `watchlist.yaml` and fill with your own items.
#
# The tool is list-driven on purpose: matching an item from an arbitrary
# listing title is the biggest source of error. Starting from a known item
# (with an exact reference URL) and searching for listings of THAT item
# inverts the problem and gives precision.
#
# Fields:
#   name             - item name as it appears in listing titles
#   set              - set / series name
#   number           - item number within the set (confirms identity in title)
#   language         - EN or JP
#   pc_url           - reference product URL (price reference)
#   ebay_query       - (optional) custom query if the name is noisy
#   exclude_keywords - (optional) words that indicate a different lookalike item
#   group            - (optional) logical group label; scan a single group with
#                      `python main.py --group <name>`, list groups with
#                      `python main.py --list-groups`
#   tcg_set          - (optional) set name override for the tcgcsv/TCGplayer
#                      reference lookup, used when `set` does not match the
#                      tcgcsv group name exactly (case-insensitive exact match).
#                      Example: set "151" is listed on tcgcsv as
#                      "SV: Scarlet & Violet 151".
#
# Catalog fields (optional, added in 0.5.0). They are informational except for
# `pokemon_rank`, which is the last tie-breaker of the report ranking. A later
# change will generate this file from a catalog; until then fill them by hand
# or leave them out.
#   pokemon          - (optional) character/subject name shown in the report's
#                      `Pokémon` column (e.g. "Charizard")
#   pokemon_rank     - (optional) integer position in a popularity list
#                      (1 = most popular). Used as the final ranking tie-break:
#                      gross ROI -> discount -> spread -> pokemon_rank.
#                      Missing/empty = 9999 (unranked, sorts last on ties).
#   rarity           - (optional) rarity label from the catalog (informational)
#   year             - (optional) release year, integer (informational)

cards:
  - name: Example Item
    set: Example Set
    number: 1
    language: EN
    pc_url: https://www.example.com/reference/example-item-1
    exclude_keywords: [reprint, replica]
    group: chase-en
    tcg_set: "Example Set (Full TCGCSV Name)"
    pokemon: Example Subject
    pokemon_rank: 1
    rarity: Holo Rare
    year: 1999
