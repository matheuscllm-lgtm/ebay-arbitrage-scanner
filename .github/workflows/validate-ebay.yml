name: Validate eBay credentials and sample

# Initial validation on this implementation branch only when this wiring changes.
# No schedule; ordinary source pushes and pull requests do not receive secrets.
on:
  push:
    branches: [feat/ebay-psa-slab-policy]
    paths:
      - .github/workflows/validate-ebay.yml
      - validate_live.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'matheuscllm-lgtm/ebay-arbitrage-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline regression tests
        run: python -m pytest -q
      - name: Validate existing eBay secrets and process one card
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python validate_live.py --group 3 --limit 3 --psa-grade 9
      - name: Preserve validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-live-validation-${{ github.run_id }}
          path: results/live-validation/
          if-no-files-found: warn
          retention-days: 7
